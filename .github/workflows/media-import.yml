name: Optimize portfolio media
on:
  push:
    paths:
      - '.github/workflows/media-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download source and encode browser-safe preview
        env:
          VIDEO_SOURCE: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1ec8-8210-993f-cbc2a8848b5b/raw?se=2026-10-09T19%3A22%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=788a5da5-b7f0-5f9c-87dc-6d339216864a&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A20%3A26Z&ske=2026-10-10T01%3A20%3A26Z&sks=b&skv=2026-02-06&sig=2CK246E2F4v25vn4LusE26ckywZqrSJXJdOs95yJIO4%3D'
        run: |
          set -euo pipefail
          mkdir -p assets/media
          curl --fail --location --retry 3 "$VIDEO_SOURCE" --output /tmp/inkslab.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/inkslab.mp4 -t 8 -vf "scale=1280:-2" -c:v libx264 -preset medium -crf 27 -an -pix_fmt yuv420p -movflags +faststart assets/media/inkslab.mp4
          test -s assets/media/inkslab.mp4
          ls -lh assets/media/inkslab.mp4
      - name: Commit optimized video
        run: |
          git config user.name "Rok Site Media Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/inkslab.mp4
          git diff --cached --quiet || (git commit -m "Add optimized INKSLAB preview" && git push)
