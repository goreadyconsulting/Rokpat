name: Generate portfolio posters
on:
  push:
    paths: ['.github/workflows/poster-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate media stills and symbol-only logo
        run: |
          set -euo pipefail
          mkdir -p assets/posters
          for stem in top inkslab yijing emerald another-me bts service-direction service-cgi service-vfx service-design; do
            ffmpeg -hide_banner -loglevel error -y -ss 1.2 -i "assets/media/$stem.mp4" -frames:v 1 -vf "scale=1280:-2" -q:v 4 "assets/posters/$stem.jpg"
            test -s "assets/posters/$stem.jpg"
          done
          ffmpeg -hide_banner -loglevel error -y -i assets/brand/rp-white.png -vf "crop=iw:iw:0:0" -frames:v 1 assets/brand/rp-symbol.png
          test -s assets/brand/rp-symbol.png
          ls -lh assets/posters assets/brand/rp-symbol.png
      - name: Commit website still images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posters/ assets/brand/rp-symbol.png
          git diff --cached --quiet || (git commit -m "Add local video posters and symbol-only logo" && git push)
